/* ================= State ================= */
const KEY='samity_v1';
let lang='bn', role='admin', tab='home';
let db = load() || {members:[],deposits:[],bank:[],loans:[],invests:[],notes:[]};
let tmpImg=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage full / সংরক্ষণ ব্যর্থ। ব্যাকআপ নিন ও পুরনো স্লিপ কমান।')}}
const t=k=>T[lang][k]||k;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc=()=>lang==='bn'?'bn-BD':'en-IN';
const money=n=>'৳'+Number(n||0).toLocaleString(loc(),{maximumFractionDigits:0});
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>today().slice(0,7);
const fmtDate=d=>d?new Date(d).toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'}):'';
const fmtMonth=m=>m?new Date(m+'-01').toLocaleDateString(loc(),{month:'long',year:'numeric'}):'';
const mName=id=>(db.members.find(m=>m.id===id)||{name:'?'}).name;
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);

function calc(){
  const dep=sum(db.deposits.filter(d=>d.status==='approved'));
  const bank=sum(db.bank);
  const loanGiven=sum(db.loans), loanBack=sum(db.loans.filter(l=>l.repaid));
  const inv=sum(db.invests);
  const profit=db.invests.reduce((s,i)=>s+sum(i.profits||[]),0);
  const ret=db.invests.reduce((s,i)=>s+(+i.returned||0),0);
  const loss=db.invests.reduce((s,i)=>s+(i.closed?Math.max(0,i.amount-(+i.returned||0)):0),0);
  return {dep,bank,profit,loss,fund:dep+profit-loss,cash:dep+profit+ret-bank-loanGiven+loanBack-inv};
}
function notify(text){db.notes.unshift({id:uid(),text,date:new Date().toISOString()});}
function seenCount(){return +(localStorage.getItem('samity_seen')||0)}

/* ================= Render ================= */
function render(){
  const c=calc();
  const pend=db.deposits.filter(d=>d.status==='pending').length;
  const unread=Math.max(0,db.notes.length-seenCount());
  const isAdmin=role==='admin', canBank=role==='admin'||role==='cashier';
  document.getElementById('app').innerHTML=`
  <div class="bg-[#101b33] text-white p-5 pt-6 rounded-b-3xl shadow-md shrink-0">
    <div class="flex items-center justify-center gap-2 mb-3">
      ${db.logo?`<img src="${db.logo}" class="h-10 w-10 object-contain bg-white rounded-xl p-0.5">`:`<div class="h-10 w-10 rounded-xl bg-white/10 flex items-center justify-center"><i class="fa-solid fa-people-group"></i></div>`}
      <div><p class="font-extrabold text-sm tracking-wide leading-tight">FRIENDS FOREVER</p><p class="text-[10px] text-amber-300 tracking-widest">FRIENDSHIP TOGETHER</p></div>
    </div>
    <div class="flex justify-between items-center mb-4">
      <div class="flex gap-2">
        <button onclick="toggleLang()" class="bg-slate-800/80 border border-slate-700 text-[11px] px-3 py-1.5 rounded-full"><i class="fa-solid fa-globe text-blue-400 mr-1"></i>${lang==='bn'?'English':'বাংলা'}</button>
        <button onclick="openSettings()" class="w-8 h-8 rounded-full bg-slate-800/80 text-slate-300"><i class="fa-solid fa-gear text-xs"></i></button>
      </div>
      <div class="text-center">
        <p class="text-[11px] text-slate-400">${t('welcome')}</p>
        <select onchange="role=this.value;tab='home';render()" class="bg-transparent font-bold text-sm text-white outline-none text-center">
          ${['admin','cashier','member'].map(r=>`<option class="text-black" value="${r}" ${role===r?'selected':''}>${t(r)}</option>`).join('')}
        </select>
      </div>
      <button onclick="openNotes()" class="w-8 h-8 rounded-full bg-slate-800/80 text-slate-300 relative"><i class="fa-regular fa-bell text-xs"></i>${unread?`<span class="absolute -top-1 -right-1 min-w-4 h-4 px-1 bg-blue-500 rounded-full text-[9px] flex items-center justify-center">${unread}</span>`:''}</button>
    </div>
    <p class="text-xs text-slate-400">${t('total_pool')}</p>
    <h1 class="text-3xl font-extrabold mb-3">${money(c.fund)}</h1>
    <div class="grid grid-cols-2 gap-2 text-[11px]">
      <div class="bg-slate-800/70 rounded-xl p-2.5"><p class="text-slate-400"><i class="fa-solid fa-wallet mr-1"></i>${t('cash_hand')}</p><p class="font-bold text-sm ${c.cash<0?'text-rose-400':''}">${money(c.cash)}</p></div>
      <div class="bg-slate-800/70 rounded-xl p-2.5"><p class="text-slate-400"><i class="fa-solid fa-building-columns mr-1"></i>${t('in_bank')}</p><p class="font-bold text-sm">${money(c.bank)}</p></div>
    </div>
    ${c.cash<0?`<p class="text-[10px] text-rose-300 mt-1">${t('warn_neg')}</p>`:''}
    <div class="grid grid-cols-5 gap-1.5 mt-4">
      ${qa('blue','fa-plus',t('a_deposit'),"openDeposit()")}
      ${qa('cyan','fa-building-columns',t('a_bank'),"openBank()")}
      ${qa('purple','fa-hand-holding-dollar',t('a_loan'),"openLoan()")}
      ${qa('emerald','fa-chart-line',t('a_invest'),"openInvest()")}
      ${qa('amber','fa-envelope',t('a_remind'),"openRemind()")}
    </div>
  </div>
  <div class="flex-1 overflow-y-auto hs p-4 pb-24">${body(c)}</div>
  <div class="absolute bottom-3 left-0 right-0 flex justify-center px-4 pointer-events-none">
    <div class="pointer-events-auto bg-[#0b1222] text-slate-400 px-3 py-2 rounded-full flex gap-1 shadow-2xl border border-slate-800 text-[10px]">
      ${nav('home','fa-house',t('home'))}${nav('history','fa-list',t('history'))}${nav('approvals','fa-circle-check',t('approvals'),pend)}${nav('bank','fa-building-columns',t('bank'))}${nav('settle','fa-scale-balanced',t('settle'))}
    </div>
  </div>`;
}
function qa(col,ic,label,fn){return `<button onclick="${fn}" class="flex flex-col items-center"><div class="w-11 h-11 rounded-2xl bg-${col}-600 flex items-center justify-center text-white active:scale-95"><i class="fa-solid ${ic} text-sm"></i></div><span class="text-[10px] mt-1 text-slate-300 text-center leading-tight">${label}</span></button>`}
function nav(id,ic,label,badge){return `<button onclick="tab='${id}';render()" class="relative px-2.5 py-1 rounded-full flex flex-col items-center ${tab===id?'text-white bg-slate-800':''}"><i class="fa-solid ${ic} text-sm"></i><span>${label}</span>${badge?`<span class="absolute top-0 right-1 bg-rose-500 text-white rounded-full text-[9px] px-1">${badge}</span>`:''}</button>`}

function body(c){
  if(tab==='history') return historyView();
  if(tab==='approvals') return approvalsView();
  if(tab==='bank') return bankView();
  if(tab==='settle') return settleView();
  return homeView();
}
function sec(title,right=''){return `<div class="flex justify-between items-center mb-2 mt-4 first:mt-0"><h3 class="font-bold text-slate-800 text-xs uppercase tracking-wider">${title}</h3>${right}</div>`}
const empty=txt=>`<p class="text-center text-[11px] text-slate-400 py-4 border border-dashed border-slate-200 rounded-2xl">${txt}</p>`;

function homeView(){
  const isAdmin=role==='admin';
  let h=sec(t('members'),isAdmin?`<button onclick="openMember()" class="text-[11px] text-blue-600 font-semibold"><i class="fa-solid fa-user-plus mr-1"></i>${t('add_member')}</button>`:`<span class="text-[10px] bg-slate-100 px-2 rounded-full">${db.members.length}</span>`);
  h+= db.members.length? `<div class="space-y-2">${db.members.map(memberCard).join('')}</div>` : empty(t('no_members'));
  h+=sec(t('invest_title'));
  h+= db.invests.length? db.invests.map(investCard).join('') : empty(t('no_invest'));
  h+=sec(t('loans_title'));
  h+= db.loans.length? db.loans.map(l=>`<div class="bg-slate-50 border border-slate-100 rounded-2xl p-3 mb-2 text-[11px] flex justify-between items-center"><div><b class="text-xs">${esc(mName(l.memberId))}</b><p class="text-slate-400">${fmtDate(l.date)} ${l.note?'· '+esc(l.note):''}</p></div><div class="text-right"><b>${money(l.amount)}</b><br>${l.repaid?`<span class="text-emerald-600">${t('repaid')}</span>`:(role==='admin'?`<button onclick="repay('${l.id}')" class="text-blue-600 font-semibold">${t('mark_repaid')}</button>`:`<span class="text-rose-500">${t('loan_out')}</span>`)}</div></div>`).join('') : empty(t('no_loans'));
  return h;
}
function memberCard(m){
  const saved=sum(db.deposits.filter(d=>d.memberId===m.id&&d.status==='approved'));
  const due=sum(db.loans.filter(l=>l.memberId===m.id&&!l.repaid));
  const off=m.active===false;
  return `<div class="p-3 rounded-2xl border flex items-center justify-between ${off?'bg-slate-100 border-dashed opacity-60':'bg-white border-slate-100 shadow-sm'}">
    <div class="flex items-center gap-3 min-w-0"><div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center font-bold text-xs">${esc(m.name.charAt(0))}</div>
    <div class="min-w-0"><h4 class="font-bold text-xs truncate">${esc(m.name)} ${off?`<span class="text-[9px] bg-red-100 text-red-600 px-1.5 rounded">${t('left')}</span>`:''}</h4>
    <p class="text-[10px] text-slate-400 truncate">${esc(m.email||'')}</p>

function showModal(html){const m=document.getElementById('modal');document.getElementById('modalBody').innerHTML=`<button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>`+html;m.classList.remove('hidden');m.classList.add('flex')}
function closeModal(){const m=document.getElementById('modal');m.classList.add('hidden');m.classList.remove('flex');tmpImg=null}
const inp='w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs mb-3 outline-none focus:ring-2 focus:ring-blue-500';
const lbl=s=>`<label class="block text-xs font-bold text-slate-700 mb-1">${s}</label>`;

function readImage(input){
  const f=input.files[0]; if(!f){tmpImg=null;return}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpImg=c.toDataURL('image/jpeg',0.7)};im.src=r.result};
  r.readAsDataURL(f);
}

function settleData(){
  const c=calc();
  const rows=db.members.map(m=>({m,dep:sum(db.deposits.filter(d=>d.memberId===m.id&&d.status==='approved')),due:sum(db.loans.filter(l=>l.memberId===m.id&&!l.repaid))})).filter(r=>r.dep>0||r.due>0);
  rows.forEach(r=>{r.ratio=c.dep?r.dep/c.dep:0;r.profit=c.profit*r.ratio;r.loss=c.loss*r.ratio;r.pay=r.dep+r.profit-r.loss-r.due});
  return {c,rows};
}
function settleView(){
  const {c,rows}=settleData();
  const open=db.invests.filter(i=>!i.closed).reduce((s,i)=>s+Math.max(0,i.amount-(+i.returned||0)),0);
  const due=sum(db.loans.filter(l=>!l.repaid));
  const pend=db.deposits.filter(d=>d.status==='pending').length;
  let h=sec(t('s_title'),rows.length?`<button onclick="dlSettle()" class="text-[11px] text-blue-600 font-semibold"><i class="fa-solid fa-download mr-1"></i>${t('s_dl')}</button>`:'');
  const w=[];
  if(open>0)w.push(`${t('s_w_inv')} ${money(open)}`);
  if(due>0)w.push(`${t('s_w_loan')} ${money(due)}`);
  if(pend>0)w.push(`${t('s_w_pend')} ${pend}`);
  if(w.length)h+=`<div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-[11px] text-amber-800 mb-3 space-y-0.5">${w.map(x=>`<p><i class="fa-solid fa-triangle-exclamation mr-1"></i>${x}</p>`).join('')}</div>`;
  if(!rows.length)return h+empty(t('s_none'));
  h+=rows.map(r=>`<div class="bg-white border border-slate-100 rounded-2xl p-3 shadow-sm mb-2 text-[11px]">
    <div class="flex justify-between items-center"><b class="text-xs">${esc(r.m.name)} <span class="text-slate-400 font-normal">(${(r.ratio*100).toLocaleString(loc(),{maximumFractionDigits:1})}%)</span></b><b class="text-sm text-emerald-700">${money(r.pay)}</b></div>
    <div class="grid grid-cols-2 gap-x-3 mt-1 text-slate-500"><span>${t('s_dep')}: <b class="text-slate-700">${money(r.dep)}</b></span><span>${t('s_share')}: <b class="text-emerald-600">+${money(r.profit)}</b></span>
    ${c.loss?`<span>${t('s_loss')}: <b class="text-rose-500">-${money(r.loss)}</b></span>`:''}${r.due?`<span>${t('s_due')}: <b class="text-rose-500">-${money(r.due)}</b></span>`:''}</div></div>`).join('');
  const tot=rows.reduce((s,r)=>s+r.pay,0);
  h+=`<div class="bg-[#101b33] text-white rounded-2xl p-3 text-[11px]"><div class="flex justify-between"><span>${t('total_profit')}</span><b>${money(c.profit)}</b></div>
   <div class="flex justify-between"><span>${t('s_total')}</span><b>${money(tot)}</b></div><div class="flex justify-between"><span>${t('s_have')}</span><b>${money(c.cash+c.bank)}</b></div></div>
   <p class="text-[10px] text-slate-400 mt-2">${t('s_note')}</p>`;
  return h;
}
function dlSettle(){
  const {rows}=settleData();
  const csv='\ufeffName,Deposit,Profit share,Loss share,Loan deducted,Payable\n'+rows.map(r=>['"'+r.m.name.replace(/"/g,'""')+'"',r.dep,Math.round(r.profit),Math.round(r.loss),r.due,Math.round(r.pay)].join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='settlement-'+today()+'.csv';a.click();
}
function migrate(){

}

function statement(id){
  const m=db.members.find(x=>x.id===id);
  const rows=db.deposits.filter(d=>d.memberId===id).sort((a,b)=>a.date.localeCompare(b.date));
  let csv='\ufeffMonth,Date,Amount,Method,Status,Note\n'+rows.map(d=>[d.month,d.date,d.amount,d.method,d.status,'"'+(d.note||'').replace(/"/g,'""')+'"'].join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`statement-${m.name}.csv`;a.click();
}
function toggleLang(){lang=lang==='bn'?'en':'bn';document.documentElement.lang=lang;render()}

migrate();
render();
</script>
